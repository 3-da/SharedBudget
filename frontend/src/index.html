<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SharedBudget</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SharedBudget brings clarity to household income, expenses, savings, and shared financial decisions.">
  <meta property="og:title" content="SharedBudget — Money, managed together">
  <meta property="og:description" content="Plan household finances, build savings, and agree on shared spending with complete transparency.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#172033">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    .app-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      color: #667085;
      background: #f4f6fa;
    }
    @media (prefers-color-scheme: dark) {
      .app-loading { background: #111722; color: #aab3c2; }
      .app-loading .bar { background: #2c3747; }
      .app-loading .bar::after { background: #8facf0; }
    }
    .app-loading .bar {
      width: 200px;
      height: 4px;
      background: #e2e7ef;
      border-radius: 2px;
      overflow: hidden;
      margin-top: 16px;
    }
    .app-loading .bar::after {
      content: '';
      display: block;
      width: 40%;
      height: 100%;
      background: #315ca8;
      border-radius: 2px;
      animation: loading-bar 1.2s ease-in-out infinite;
    }
    @keyframes loading-bar {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
  </style>
</head>
<body>
  <app-root>
    <div class="app-loading">
      <div>Loading SharedBudget...</div>
      <div class="bar"></div>
    </div>
  </app-root>
</body>
</html>
